<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #9aa0a6; margin-bottom: 2rem; font-size: 0.9rem; }
    .controls { display: flex; gap: 1rem; margin-bottom: 2rem; }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #1a73e8; color: white; }
    #stopBtn { background: #5f6368; color: white; }
    #status {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      background: #1e2128;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #9aa0a6;
    }
    #status.connected { color: #81c995; }
    #status.speaking { color: #fdd663; }
    #transcript {
      width: 100%;
      max-width: 640px;
      background: #1e2128;
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 300px;
      overflow-y: auto;
    }
    .msg { margin-bottom: 1rem; line-height: 1.5; }
    .msg .role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    .msg.user .role { color: #8ab4f8; }
    .msg.agent .role { color: #81c995; }
    .msg .text { font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Voice Agent</h1>
  <p class="subtitle">Full-duplex voice assistant with barge-in</p>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <div id="status">Disconnected</div>
  <div id="transcript"></div>

  <script>
    const SAMPLE_RATE = 16000;
    const FRAME_SAMPLES = 1600;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');

    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let processor = null;
    let source = null;
    let running = false;

    const playbackQueue = [];
    let currentSource = null;
    let isPlaying = false;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `<div class="role">${role}</div><div class="text">${text}</div>`;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function float32ToInt16(float32Array) {
      const int16 = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return int16;
    }

    function handleBargeIn() {
      if (currentSource) {
        try { currentSource.stop(); } catch (_) {}
        currentSource = null;
      }
      playbackQueue.length = 0;
      isPlaying = false;
      setStatus('Listening (barge-in)', 'connected');
    }

    async function playNext() {
      if (isPlaying || playbackQueue.length === 0) return;
      isPlaying = true;
      setStatus('Agent speaking…', 'speaking');

      const arrayBuffer = playbackQueue.shift();
      try {
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
        currentSource = audioContext.createBufferSource();
        currentSource.buffer = audioBuffer;
        currentSource.connect(audioContext.destination);
        currentSource.onended = () => {
          currentSource = null;
          isPlaying = false;
          if (playbackQueue.length > 0) {
            playNext();
          } else {
            setStatus('Listening', 'connected');
          }
        };
        currentSource.start();
      } catch (err) {
        console.error('Playback error:', err);
        isPlaying = false;
        playNext();
      }
    }

    function enqueueAudio(arrayBuffer) {
      playbackQueue.push(arrayBuffer);
      playNext();
    }

    function connectWebSocket() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => setStatus('Connected — speak now', 'connected');

      ws.onmessage = (event) => {
        if (typeof event.data === 'string') {
          const msg = JSON.parse(event.data);
          if (msg.type === 'transcript') {
            addTranscript(msg.role, msg.text);
          } else if (msg.type === 'barge_in') {
            handleBargeIn();
          } else if (msg.type === 'error') {
            addTranscript('agent', `Error: ${msg.message}`);
          }
        } else {
          enqueueAudio(event.data);
        }
      };

      ws.onclose = () => {
        setStatus('Disconnected');
        if (running) stop();
      };

      ws.onerror = () => setStatus('WebSocket error');
    }

    async function start() {
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      transcriptEl.innerHTML = '';

      audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: SAMPLE_RATE,
          echoCancellation: true,
          noiseSuppression: true,
        },
      });

      connectWebSocket();

      source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(FRAME_SAMPLES, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        const int16 = float32ToInt16(input);
        ws.send(int16.buffer);
      };

      source.connect(processor);
      processor.connect(audioContext.destination);
    }

    function stop() {
      running = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      handleBargeIn();

      if (processor) { processor.disconnect(); processor = null; }
      if (source) { source.disconnect(); source = null; }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }

      setStatus('Disconnected');
    }

    startBtn.addEventListener('click', () => start().catch(err => {
      setStatus(`Mic error: ${err.message}`);
      stop();
    }));
    stopBtn.addEventListener('click', stop);
  </script>
</body>
</html>
