<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #9aa0a6; margin-bottom: 2rem; font-size: 0.9rem; }
    .controls { display: flex; gap: 1rem; margin-bottom: 2rem; }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #1a73e8; color: white; }
    #stopBtn { background: #5f6368; color: white; }
    #status {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      background: #1e2128;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #9aa0a6;
      max-width: 640px;
      text-align: center;
    }
    #status.connected { color: #81c995; }
    #status.hearing { color: #8ab4f8; }
    #status.speaking { color: #fdd663; }
    #status.error { color: #f28b82; }
    #transcript {
      width: 100%;
      max-width: 640px;
      background: #1e2128;
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 300px;
      overflow-y: auto;
    }
    .msg { margin-bottom: 1rem; line-height: 1.5; }
    .msg .role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    .msg.user .role { color: #8ab4f8; }
    .msg.agent .role { color: #81c995; }
    .msg.error .role { color: #f28b82; }
    .msg.partial .role { color: #8ab4f8; }
    .msg.partial .text {
      font-size: 0.95rem;
      color: #bdc1c6;
      font-style: italic;
    }
    .msg.partial .badge {
      display: inline-block;
      margin-left: 0.5rem;
      font-size: 0.65rem;
      color: #9aa0a6;
      font-style: normal;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .msg .text { font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Voice Agent</h1>
  <p class="subtitle">Full-duplex voice assistant with barge-in</p>

  <div class="controls">
    <button id="startBtn" type="button">Start</button>
    <button id="stopBtn" type="button" disabled>Stop</button>
  </div>

  <div id="status">Disconnected</div>
  <div id="transcript"></div>

  <script>
    const TARGET_RATE = 16000;
    const SEND_SAMPLES = 320; // 20 ms at 16 kHz
    const PROCESSOR_SIZE = 4096; // must be 256|512|1024|2048|4096|8192|16384
    const SPEECH_RMS_THRESHOLD = 0.02;
    const MIC_GAIN = 3.0;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');

    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let processor = null;
    let muteGain = null;
    let source = null;
    let running = false;
    let userSpeaking = false;
    let pendingSamples = new Float32Array(0);
    let resamplePhase = 0;

    const playbackQueue = [];
    let currentSource = null;
    let isPlaying = false;
    let liveCaptionEl = null;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function showError(message) {
      setStatus(message, 'error');
      addTranscript('error', message);
      console.error(message);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clearLiveCaption() {
      if (liveCaptionEl) {
        liveCaptionEl.remove();
        liveCaptionEl = null;
      }
    }

    function updatePartialCaption(text) {
      const safe = escapeHtml(text);
      if (!liveCaptionEl) {
        liveCaptionEl = document.createElement('div');
        liveCaptionEl.className = 'msg user partial';
        liveCaptionEl.innerHTML =
          '<div class="role">you<span class="badge">live</span></div><div class="text"></div>';
        transcriptEl.appendChild(liveCaptionEl);
      }
      liveCaptionEl.querySelector('.text').textContent = text;
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function finalizeUserTranscript(text) {
      clearLiveCaption();
      addTranscript('user', text);
    }

    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const safe = escapeHtml(text);
      div.innerHTML = `<div class="role">${role}</div><div class="text">${safe}</div>`;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function checkMicSupport() {
      if (!window.isSecureContext) {
        throw new Error(
          'Microphone requires a secure context. Use https://your-domain or http://localhost — ' +
          'browsers block mic access on plain http:// IP addresses.'
        );
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Microphone API not available in this browser.');
      }
    }

    function resampleStateful(input, fromRate, toRate) {
      if (fromRate === toRate) return input;
      const ratio = fromRate / toRate;
      const output = [];
      let pos = resamplePhase;
      while (pos < input.length) {
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const a = input[idx] ?? 0;
        const b = input[idx + 1] ?? a;
        output.push(a * (1 - frac) + b * frac);
        pos += ratio;
      }
      resamplePhase = pos - input.length;
      return new Float32Array(output);
    }

    function concatFloat32(a, b) {
      const out = new Float32Array(a.length + b.length);
      out.set(a, 0);
      out.set(b, a.length);
      return out;
    }

    function computeRms(float32Array) {
      if (!float32Array.length) return 0;
      let sum = 0;
      for (let i = 0; i < float32Array.length; i++) {
        sum += float32Array[i] * float32Array[i];
      }
      return Math.sqrt(sum / float32Array.length);
    }

    function updateMicStatus(rms) {
      if (!running || isPlaying) return;
      const speaking = rms > SPEECH_RMS_THRESHOLD;
      if (speaking && !userSpeaking) {
        userSpeaking = true;
        setStatus('Hearing you…', 'hearing');
      } else if (!speaking && userSpeaking) {
        userSpeaking = false;
        setStatus('Listening', 'connected');
      }
    }

    function applyGain(float32Array, gain) {
      const out = new Float32Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        out[i] = Math.max(-1, Math.min(1, float32Array[i] * gain));
      }
      return out;
    }

    function float32ToInt16(float32Array) {
      const int16 = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return int16;
    }

    function sendPcmChunk(float32Chunk) {
      const boosted = applyGain(float32Chunk, MIC_GAIN);
      const int16 = float32ToInt16(boosted);
      ws.send(int16.buffer.slice(int16.byteOffset, int16.byteOffset + int16.byteLength));
    }

    function flushPendingSamples() {
      while (pendingSamples.length >= SEND_SAMPLES && ws && ws.readyState === WebSocket.OPEN) {
        const chunk = pendingSamples.slice(0, SEND_SAMPLES);
        pendingSamples = pendingSamples.slice(SEND_SAMPLES);
        sendPcmChunk(chunk);
      }
    }

    function handleBargeIn() {
      if (currentSource) {
        try { currentSource.stop(); } catch (_) {}
        currentSource = null;
      }
      playbackQueue.length = 0;
      isPlaying = false;
      clearLiveCaption();
      setStatus('Listening (barge-in)', 'connected');
    }

    async function playNext() {
      if (isPlaying || playbackQueue.length === 0 || !audioContext) return;
      isPlaying = true;
      setStatus('Agent speaking…', 'speaking');

      const arrayBuffer = playbackQueue.shift();
      try {
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
        currentSource = audioContext.createBufferSource();
        currentSource.buffer = audioBuffer;
        currentSource.connect(audioContext.destination);
        currentSource.onended = () => {
          currentSource = null;
          isPlaying = false;
          if (playbackQueue.length > 0) {
            playNext();
          } else {
            setStatus('Listening', 'connected');
          }
        };
        currentSource.start();
      } catch (err) {
        console.error('Playback error:', err);
        isPlaying = false;
        playNext();
      }
    }

    function enqueueAudio(arrayBuffer) {
      playbackQueue.push(arrayBuffer);
      playNext();
    }

    function connectWebSocket() {
      return new Promise((resolve, reject) => {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          setStatus('Connected — speak now', 'connected');
          resolve();
        };

        ws.onmessage = (event) => {
          if (typeof event.data === 'string') {
            const msg = JSON.parse(event.data);
            if (msg.type === 'transcript_partial') {
              updatePartialCaption(msg.text);
              if (!isPlaying) {
                setStatus('Hearing you…', 'hearing');
              }
            } else if (msg.type === 'transcript') {
              if (msg.role === 'user' && msg.final) {
                finalizeUserTranscript(msg.text);
              } else {
                addTranscript(msg.role, msg.text);
              }
            } else if (msg.type === 'barge_in') {
              handleBargeIn();
            } else if (msg.type === 'error') {
              showError(msg.message);
            }
          } else {
            enqueueAudio(event.data);
          }
        };

        ws.onclose = () => {
          if (running) {
            setStatus('WebSocket disconnected', 'error');
            stop();
          }
        };

        ws.onerror = () => {
          reject(new Error('WebSocket connection failed — is the server running?'));
        };
      });
    }

    async function start() {
      checkMicSupport();

      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      transcriptEl.innerHTML = '';
      clearLiveCaption();
      pendingSamples = new Float32Array(0);
      resamplePhase = 0;

      setStatus('Requesting microphone access…');

      audioContext = new AudioContext({ sampleRate: TARGET_RATE });
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: TARGET_RATE,
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: true,
        },
      });

      setStatus('Connecting…');
      await connectWebSocket();

      const nativeRate = audioContext.sampleRate;
      source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(PROCESSOR_SIZE, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        updateMicStatus(computeRms(input));
        const atTarget = resampleStateful(input, nativeRate, TARGET_RATE);
        pendingSamples = concatFloat32(pendingSamples, atTarget);
        flushPendingSamples();
      };

      muteGain = audioContext.createGain();
      muteGain.gain.value = 0;
      source.connect(processor);
      processor.connect(muteGain);
      muteGain.connect(audioContext.destination);
    }

    function stop() {
      running = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      pendingSamples = new Float32Array(0);
      resamplePhase = 0;

      handleBargeIn();
      clearLiveCaption();

      userSpeaking = false;
      if (processor) { processor.disconnect(); processor.onaudioprocess = null; processor = null; }
      if (muteGain) { muteGain.disconnect(); muteGain = null; }
      if (source) { source.disconnect(); source = null; }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }

      setStatus('Disconnected');
    }

    startBtn.addEventListener('click', () => {
      start().catch(err => {
        showError(err.message || String(err));
        stop();
      });
    });
    stopBtn.addEventListener('click', stop);
  </script>
</body>
</html>
