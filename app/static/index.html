<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-dvh overflow-hidden bg-zinc-950 text-zinc-100 antialiased">
  <div class="flex h-full min-h-0 flex-col md:flex-row">
    <aside class="flex h-1/2 min-h-0 flex-col border-b border-zinc-800 md:h-full md:w-96 md:shrink-0 md:border-b-0 md:border-r">
      <div class="min-h-0 flex-1 overflow-y-auto p-5">
        <header class="mb-6">
          <h1 class="text-xl font-semibold tracking-tight">Voice Agent</h1>
          <p class="mt-1 text-sm text-zinc-400">Full-duplex assistant with barge-in</p>
        </header>

        <section class="space-y-4 rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
          <div class="space-y-1">
            <label for="ttsEngineSelect" class="block text-xs font-medium uppercase tracking-wide text-zinc-500">Speech engine</label>
            <select id="ttsEngineSelect" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500 disabled:opacity-50">
              <option value="kokoro">Local Kokoro</option>
              <option value="azure">Azure Speech</option>
            </select>
          </div>
          <div class="space-y-1">
            <label for="ttsVoiceSelect" class="block text-xs font-medium uppercase tracking-wide text-zinc-500">Voice</label>
            <select id="ttsVoiceSelect" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500 disabled:opacity-50"></select>
          </div>
          <div class="space-y-1">
            <div class="flex items-baseline justify-between">
              <label for="ttsSpeedSlider" class="text-xs font-medium uppercase tracking-wide text-zinc-500">Speed</label>
              <span id="ttsSpeedValue" class="text-sm text-zinc-200">1.05×</span>
            </div>
            <input id="ttsSpeedSlider" type="range" min="0.75" max="1.5" step="0.05" value="1.05" class="w-full accent-sky-500 disabled:opacity-50" />
          </div>
          <p id="ttsHint" class="min-h-[1.25rem] text-xs text-zinc-500"></p>
        </section>

        <div class="mt-4 flex flex-wrap gap-3">
          <button id="startBtn" type="button" class="rounded-lg bg-sky-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-sky-500 disabled:cursor-not-allowed disabled:opacity-40">Start</button>
          <button id="stopBtn" type="button" disabled class="rounded-lg bg-zinc-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-zinc-500 disabled:cursor-not-allowed disabled:opacity-40">Stop</button>
        </div>

        <button id="logoutBtn" type="button" class="mt-6 w-full rounded-lg border border-zinc-700 px-4 py-2 text-sm text-zinc-300 transition hover:bg-zinc-800">Log out</button>
      </div>
    </aside>

    <main class="flex h-1/2 min-h-0 flex-1 flex-col md:h-full">
      <div class="flex min-h-0 flex-1 flex-col overflow-hidden p-5">
        <h2 class="mb-3 shrink-0 text-xs font-medium uppercase tracking-wide text-zinc-500">Conversation</h2>
        <div id="status" class="shrink-0 rounded-lg border border-zinc-800 bg-zinc-900 px-4 py-2 text-center text-sm text-zinc-400">Disconnected</div>
        <div id="transcript" class="mt-4 min-h-0 flex-1 overflow-y-auto rounded-xl border border-zinc-800 bg-zinc-900/40 p-4"></div>
      </div>
    </main>
  </div>

  <script>
    const TARGET_RATE = 16000;
    const SEND_SAMPLES = 320; // 20 ms at 16 kHz
    const PROCESSOR_SIZE = 1024; // must be 256|512|1024|2048|4096|8192|16384
    const SPEECH_RMS_THRESHOLD = 0.02;
    const ECHO_TAIL_MS = 800;
    const MIC_GAIN = 3.0;

    const TTS_STORAGE_KEY = 'voice-agent-tts-v1';

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const ttsEngineSelect = document.getElementById('ttsEngineSelect');
    const ttsVoiceSelect = document.getElementById('ttsVoiceSelect');
    const ttsSpeedSlider = document.getElementById('ttsSpeedSlider');
    const ttsSpeedValue = document.getElementById('ttsSpeedValue');
    const ttsHintEl = document.getElementById('ttsHint');
    const logoutBtn = document.getElementById('logoutBtn');

    const STATUS_BASE =
      'rounded-lg border border-zinc-800 bg-zinc-900 px-4 py-2 text-center text-sm';
    const STATUS_VARIANTS = {
      '': `${STATUS_BASE} text-zinc-400`,
      connected: `${STATUS_BASE} text-emerald-400`,
      hearing: `${STATUS_BASE} text-sky-400`,
      speaking: `${STATUS_BASE} text-amber-300`,
      error: `${STATUS_BASE} text-red-400`,
    };
    const MSG_WRAP = 'mb-4 leading-relaxed';
    const ROLE_CLASS = {
      user: 'text-xs uppercase tracking-wide text-sky-400 mb-1',
      agent: 'text-xs uppercase tracking-wide text-emerald-400 mb-1',
      error: 'text-xs uppercase tracking-wide text-red-400 mb-1',
    };

    let ttsCatalog = null;

    let ws = null;
    let micContext = null;
    let playbackContext = null;
    let mediaStream = null;
    let processor = null;
    let muteGain = null;
    let source = null;
    let running = false;
    let userSpeaking = false;
    let pendingSamples = new Float32Array(0);
    let resamplePhase = 0;

    const playbackQueue = [];
    let currentSource = null;
    let isPlaying = false;
    let inEchoTail = false;
    let echoTailTimer = null;
    let agentPlaybackActive = false;
    let agentAudioStreamComplete = false;
    let pendingPlaybackIdleEpoch = null;
    let liveCaptionEl = null;
    let liveAgentCaptionEl = null;
    let pendingAgentCaption = null;
    let stashedAgentFinalText = null;
    let agentRevealedText = '';
    let agentWordRevealTimer = null;
    let speechReady = false;
    let startupFailed = false;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = STATUS_VARIANTS[cls] || STATUS_VARIANTS[''];
    }

    function showError(message) {
      setStatus(message, 'error');
      addTranscript('error', message);
      console.error(message);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clearLiveCaption() {
      if (liveCaptionEl) {
        liveCaptionEl.remove();
        liveCaptionEl = null;
      }
    }

    function updatePartialCaption(text) {
      const safe = escapeHtml(text);
      if (!liveCaptionEl) {
        liveCaptionEl = document.createElement('div');
        liveCaptionEl.className = MSG_WRAP;
        liveCaptionEl.innerHTML =
          '<div class="text-xs uppercase tracking-wide text-sky-400 mb-1">you<span class="ml-2 text-[0.65rem] normal-case text-zinc-500">live</span></div><div class="text text-[0.95rem] italic text-zinc-400"></div>';
        transcriptEl.appendChild(liveCaptionEl);
      }
      liveCaptionEl.querySelector('.text').textContent = text;
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function finalizeUserTranscript(text) {
      clearLiveCaption();
      addTranscript('user', text);
    }

    function clearAgentWordRevealTimer() {
      if (agentWordRevealTimer !== null) {
        clearInterval(agentWordRevealTimer);
        agentWordRevealTimer = null;
      }
    }

    function ensureLiveAgentCaption() {
      if (!liveAgentCaptionEl) {
        liveAgentCaptionEl = document.createElement('div');
        liveAgentCaptionEl.className = MSG_WRAP;
        liveAgentCaptionEl.innerHTML =
          '<div class="text-xs uppercase tracking-wide text-emerald-400 mb-1">agent<span class="ml-2 text-[0.65rem] normal-case text-zinc-500">live</span></div><div class="text text-[0.95rem] italic text-zinc-400"></div>';
        transcriptEl.appendChild(liveAgentCaptionEl);
      }
      return liveAgentCaptionEl.querySelector('.text');
    }

    function updateLiveAgentCaptionDisplay() {
      const textEl = ensureLiveAgentCaption();
      textEl.textContent = agentRevealedText.trim();
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function startClauseWordReveal(clauseText, durationSec) {
      clearAgentWordRevealTimer();
      const words = clauseText.trim().split(/\s+/).filter(Boolean);
      if (!words.length) return;

      const prefix = agentRevealedText.trim();
      const base = prefix ? `${prefix} ` : '';
      let clausePart = words[0];
      agentRevealedText = base + clausePart;
      updateLiveAgentCaptionDisplay();

      if (words.length === 1) return;

      const remaining = words.slice(1);
      const intervalMs = Math.max(16, (durationSec * 1000) / remaining.length);
      let idx = 0;
      agentWordRevealTimer = setInterval(() => {
        clausePart += ` ${remaining[idx]}`;
        agentRevealedText = base + clausePart;
        updateLiveAgentCaptionDisplay();
        idx += 1;
        if (idx >= remaining.length) {
          clearAgentWordRevealTimer();
        }
      }, intervalMs);
    }

    function flushClauseWordReveal(clauseText, clauseBase) {
      clearAgentWordRevealTimer();
      const trimmed = clauseText.trim();
      if (!trimmed) return;
      const base = clauseBase.trim();
      agentRevealedText = base ? `${base} ${trimmed}` : trimmed;
      updateLiveAgentCaptionDisplay();
    }

    function clearLiveAgentCaption() {
      clearAgentWordRevealTimer();
      if (liveAgentCaptionEl) {
        liveAgentCaptionEl.remove();
        liveAgentCaptionEl = null;
      }
    }

    function resetAgentCaptionState() {
      clearLiveAgentCaption();
      pendingAgentCaption = null;
      stashedAgentFinalText = null;
      agentRevealedText = '';
    }

    function finalizeAgentTranscript() {
      clearAgentWordRevealTimer();
      const finalText = (stashedAgentFinalText || agentRevealedText).trim();
      stashedAgentFinalText = null;
      agentRevealedText = '';
      clearLiveAgentCaption();
      if (finalText) {
        addTranscript('agent', finalText);
      }
    }

    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = MSG_WRAP;
      const safe = escapeHtml(text);
      const roleClass = ROLE_CLASS[role] || ROLE_CLASS.user;
      div.innerHTML = `<div class="${roleClass}">${role}</div><div class="text-sm text-zinc-100">${safe}</div>`;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function checkMicSupport() {
      if (!window.isSecureContext) {
        throw new Error(
          'Microphone requires a secure context. Use https://your-domain or http://localhost — ' +
          'browsers block mic access on plain http:// IP addresses.'
        );
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Microphone API not available in this browser.');
      }
    }

    function resampleStateful(input, fromRate, toRate) {
      if (fromRate === toRate) return input;
      const ratio = fromRate / toRate;
      const output = [];
      let pos = resamplePhase;
      while (pos < input.length) {
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const a = input[idx] ?? 0;
        const b = input[idx + 1] ?? a;
        output.push(a * (1 - frac) + b * frac);
        pos += ratio;
      }
      resamplePhase = pos - input.length;
      return new Float32Array(output);
    }

    function concatFloat32(a, b) {
      const out = new Float32Array(a.length + b.length);
      out.set(a, 0);
      out.set(b, a.length);
      return out;
    }

    function computeRms(float32Array) {
      if (!float32Array.length) return 0;
      let sum = 0;
      for (let i = 0; i < float32Array.length; i++) {
        sum += float32Array[i] * float32Array[i];
      }
      return Math.sqrt(sum / float32Array.length);
    }

    function updateMicStatus(rms) {
      if (!running || isPlaying) return;
      const speaking = rms > SPEECH_RMS_THRESHOLD;
      if (speaking && !userSpeaking) {
        userSpeaking = true;
        setStatus('Hearing you…', 'hearing');
      } else if (!speaking && userSpeaking) {
        userSpeaking = false;
        setStatus('Listening', 'connected');
      }
    }

    function applyGain(float32Array, gain) {
      const out = new Float32Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        out[i] = Math.max(-1, Math.min(1, float32Array[i] * gain));
      }
      return out;
    }

    function float32ToInt16(float32Array) {
      const int16 = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return int16;
    }

    function sendPcmChunk(float32Chunk) {
      const boosted = applyGain(float32Chunk, MIC_GAIN);
      const int16 = float32ToInt16(boosted);
      ws.send(int16.buffer.slice(int16.byteOffset, int16.byteOffset + int16.byteLength));
    }

    function sendRawPcmChunk(float32Chunk) {
      const int16 = float32ToInt16(float32Chunk);
      ws.send(int16.buffer.slice(int16.byteOffset, int16.byteOffset + int16.byteLength));
    }

    function agentAudible() {
      if (isPlaying || playbackQueue.length > 0 || inEchoTail) {
        return true;
      }
      if (agentPlaybackActive && !agentAudioStreamComplete) {
        return true;
      }
      return false;
    }

    function micUploadAllowed() {
      return !agentAudible();
    }

    function flushMicChunks() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const duringPlayback = agentAudible();
      while (pendingSamples.length >= SEND_SAMPLES) {
        const chunk = pendingSamples.slice(0, SEND_SAMPLES);
        pendingSamples = pendingSamples.slice(SEND_SAMPLES);
        if (duringPlayback) {
          sendRawPcmChunk(chunk);
        } else {
          sendPcmChunk(chunk);
        }
      }
    }

    function cancelEchoTail() {
      if (echoTailTimer) {
        clearTimeout(echoTailTimer);
        echoTailTimer = null;
      }
      inEchoTail = false;
    }

    function sendPlaybackIdle() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (pendingPlaybackIdleEpoch === null) return;
      ws.send(JSON.stringify({ type: 'playback_idle', epoch: pendingPlaybackIdleEpoch }));
      pendingPlaybackIdleEpoch = null;
      agentPlaybackActive = false;
      agentAudioStreamComplete = false;
    }

    function beginEchoTail() {
      if (!agentAudioStreamComplete) {
        return;
      }
      finalizeAgentTranscript();
      cancelEchoTail();
      inEchoTail = true;
      echoTailTimer = setTimeout(() => {
        echoTailTimer = null;
        inEchoTail = false;
        sendPlaybackIdle();
      }, ECHO_TAIL_MS);
    }

    function resetAgentPlaybackState() {
      agentPlaybackActive = false;
      agentAudioStreamComplete = false;
      pendingPlaybackIdleEpoch = null;
      pendingAgentCaption = null;
    }

    function flushPendingSamples() {
      if (!micUploadAllowed()) {
        return;
      }
      flushMicChunks();
    }

    function handleBargeIn() {
      cancelEchoTail();
      clearAgentWordRevealTimer();
      const partialAgent = agentRevealedText.trim();
      if (partialAgent) {
        addTranscript('agent', partialAgent);
      }
      stashedAgentFinalText = null;
      agentRevealedText = '';
      clearLiveAgentCaption();
      pendingAgentCaption = null;
      resetAgentPlaybackState();
      pendingSamples = new Float32Array(0);
      if (currentSource) {
        try { currentSource.stop(); } catch (_) {}
        currentSource = null;
      }
      playbackQueue.length = 0;
      isPlaying = false;
      clearLiveCaption();
      setStatus('Listening (barge-in)', 'connected');
    }

    async function ensurePlaybackContext() {
      if (!playbackContext) {
        playbackContext = new AudioContext();
      }
      if (playbackContext.state === 'suspended') {
        await playbackContext.resume();
      }
      return playbackContext;
    }

    async function playNext() {
      if (isPlaying || playbackQueue.length === 0) return;
      isPlaying = true;
      setStatus('Agent speaking…', 'speaking');
      const ctx = await ensurePlaybackContext();

      const item = playbackQueue.shift();
      const arrayBuffer = item.audio;
      const clauseText = item.text || '';
      const clauseBase = agentRevealedText.trim();
      try {
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
        startClauseWordReveal(clauseText, audioBuffer.duration);
        currentSource = ctx.createBufferSource();
        currentSource.buffer = audioBuffer;
        currentSource.connect(ctx.destination);
        currentSource.onended = () => {
          flushClauseWordReveal(clauseText, clauseBase);
          currentSource = null;
          isPlaying = false;
          if (playbackQueue.length > 0) {
            playNext();
          } else {
            beginEchoTail();
            setStatus('Listening', 'connected');
          }
        };
        currentSource.start();
      } catch (err) {
        console.error('Playback error:', err);
        isPlaying = false;
        playNext();
      }
    }

    function enqueueAudio(arrayBuffer) {
      if (!agentPlaybackActive) {
        agentPlaybackActive = true;
        agentAudioStreamComplete = false;
        stashedAgentFinalText = null;
        agentRevealedText = '';
        clearLiveAgentCaption();
      }
      cancelEchoTail();
      playbackQueue.push({
        audio: arrayBuffer,
        text: pendingAgentCaption || '',
      });
      pendingAgentCaption = null;
      playNext();
    }

    function loadTtsPrefs() {
      try {
        return JSON.parse(localStorage.getItem(TTS_STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function saveTtsPrefs(backend, voice, speed) {
      localStorage.setItem(
        TTS_STORAGE_KEY,
        JSON.stringify({ backend, voice, speed }),
      );
    }

    function formatSpeed(speed) {
      return `${Number(speed).toFixed(2)}×`;
    }

    function updateSpeedLabel() {
      ttsSpeedValue.textContent = formatSpeed(ttsSpeedSlider.value);
    }

    function currentTtsSelection() {
      return {
        backend: ttsEngineSelect.value,
        voice: ttsVoiceSelect.value,
        speed: parseFloat(ttsSpeedSlider.value),
      };
    }

    function populateVoiceSelect(backend) {
      const engine = ttsCatalog?.engines?.[backend];
      ttsVoiceSelect.innerHTML = '';
      if (!engine || !engine.voices?.length) {
        ttsVoiceSelect.disabled = true;
        ttsHintEl.textContent = engine?.error || 'No voices available for this engine.';
        return;
      }
      ttsVoiceSelect.disabled = running;
      ttsHintEl.textContent = engine.error || '';
      for (const v of engine.voices) {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.label || v.id;
        ttsVoiceSelect.appendChild(opt);
      }
    }

    function applyTtsSelection(backend, voice) {
      if (!ttsCatalog) return;
      const engines = ttsCatalog.engines;
      let chosenBackend = backend;
      if (!engines[chosenBackend]?.available) {
        chosenBackend = engines.kokoro?.available ? 'kokoro' : 'azure';
      }
      ttsEngineSelect.value = chosenBackend;
      ttsEngineSelect.querySelector('option[value="kokoro"]').disabled = !engines.kokoro?.available;
      ttsEngineSelect.querySelector('option[value="azure"]').disabled = !engines.azure?.available;
      populateVoiceSelect(chosenBackend);
      const voices = engines[chosenBackend]?.voices || [];
      const ids = voices.map(v => v.id);
      let chosenVoice = voice;
      if (!ids.includes(chosenVoice)) {
        chosenVoice = ttsCatalog.default_voices?.[chosenBackend] || ids[0];
      }
      if (chosenVoice) {
        ttsVoiceSelect.value = chosenVoice;
      }
      saveTtsPrefs(chosenBackend, ttsVoiceSelect.value, ttsSpeedSlider.value);
    }

    function applySpeedFromCatalog(speed) {
      const min = ttsCatalog?.speed_min ?? 0.75;
      const max = ttsCatalog?.speed_max ?? 1.5;
      const step = ttsCatalog?.speed_step ?? 0.05;
      const fallback = ttsCatalog?.default_speed ?? 1.05;
      let chosen = parseFloat(speed);
      if (Number.isNaN(chosen)) {
        chosen = fallback;
      }
      chosen = Math.min(max, Math.max(min, chosen));
      ttsSpeedSlider.min = String(min);
      ttsSpeedSlider.max = String(max);
      ttsSpeedSlider.step = String(step);
      ttsSpeedSlider.value = String(chosen);
      updateSpeedLabel();
    }

    function sendTtsConfig() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const { backend, voice, speed } = currentTtsSelection();
      ws.send(JSON.stringify({ type: 'tts_config', backend, voice, speed }));
    }

    function setTtsControlsDisabled(disabled) {
      ttsEngineSelect.disabled = disabled;
      const engine = ttsCatalog?.engines?.[ttsEngineSelect.value];
      ttsVoiceSelect.disabled = disabled || !engine?.voices?.length;
      ttsSpeedSlider.disabled = disabled;
    }

    async function initTtsPanel() {
      const res = await fetch('/api/tts');
      if (!res.ok) {
        ttsHintEl.textContent = 'Could not load TTS options.';
        return;
      }
      ttsCatalog = await res.json();
      const prefs = loadTtsPrefs();
      const backend = prefs.backend || ttsCatalog.default_backend;
      const voice = prefs.voice || ttsCatalog.default_voices?.[backend];
      const speed = prefs.speed ?? ttsCatalog.default_speed;
      applyTtsSelection(backend, voice);
      applySpeedFromCatalog(speed);
    }

    ttsEngineSelect.addEventListener('change', () => {
      const backend = ttsEngineSelect.value;
      populateVoiceSelect(backend);
      const voices = ttsCatalog?.engines?.[backend]?.voices || [];
      if (voices.length) {
        ttsVoiceSelect.value = voices[0].id;
      }
      saveTtsPrefs(backend, ttsVoiceSelect.value, ttsSpeedSlider.value);
    });

    ttsVoiceSelect.addEventListener('change', () => {
      saveTtsPrefs(ttsEngineSelect.value, ttsVoiceSelect.value, ttsSpeedSlider.value);
    });

    ttsSpeedSlider.addEventListener('input', () => {
      updateSpeedLabel();
      saveTtsPrefs(ttsEngineSelect.value, ttsVoiceSelect.value, ttsSpeedSlider.value);
    });

    initTtsPanel().catch(err => {
      console.error(err);
      ttsHintEl.textContent = 'Could not load TTS options.';
    });

    function connectWebSocket() {
      return new Promise((resolve, reject) => {
        speechReady = false;
        startupFailed = false;

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          setStatus('Connecting to speech service…');
          sendTtsConfig();
        };

        ws.onmessage = (event) => {
          if (typeof event.data === 'string') {
            const msg = JSON.parse(event.data);
            if (msg.type === 'speech_ready') {
              speechReady = true;
              setStatus('Listening — speak now', 'connected');
              resolve();
            } else if (msg.type === 'transcript_partial') {
              updatePartialCaption(msg.text);
              if (!isPlaying) {
                setStatus('Hearing you…', 'hearing');
              }
            } else if (msg.type === 'agent_caption') {
              pendingAgentCaption = msg.text;
            } else if (msg.type === 'transcript') {
              if (msg.role === 'user' && msg.final) {
                finalizeUserTranscript(msg.text);
              } else if (msg.role === 'agent' && msg.final) {
                stashedAgentFinalText = msg.text;
                if (
                  !agentPlaybackActive &&
                  !isPlaying &&
                  playbackQueue.length === 0
                ) {
                  finalizeAgentTranscript();
                }
              } else {
                addTranscript(msg.role, msg.text);
              }
            } else if (msg.type === 'agent_audio_done') {
              agentAudioStreamComplete = true;
              pendingPlaybackIdleEpoch = msg.epoch;
              if (!isPlaying && playbackQueue.length === 0) {
                beginEchoTail();
              }
            } else if (msg.type === 'barge_in') {
              handleBargeIn();
            } else if (msg.type === 'error') {
              if (!speechReady) {
                startupFailed = true;
                showError(msg.message);
                reject(new Error(msg.message));
              } else {
                showError(msg.message);
              }
            }
          } else {
            enqueueAudio(event.data);
          }
        };

        ws.onclose = () => {
          if (!running) return;
          if (!speechReady && !startupFailed) {
            startupFailed = true;
            showError('Speech service connection failed before startup completed');
          }
          stop({ preserveStatus: startupFailed });
        };

        ws.onerror = () => {
          reject(new Error('WebSocket connection failed — is the server running?'));
        };
      });
    }

    async function start() {
      checkMicSupport();

      running = true;
      speechReady = false;
      startupFailed = false;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setTtsControlsDisabled(true);
      transcriptEl.innerHTML = '';
      clearLiveCaption();
      resetAgentCaptionState();
      pendingSamples = new Float32Array(0);
      resamplePhase = 0;
      resetAgentPlaybackState();

      setStatus('Requesting microphone access…');

      micContext = new AudioContext({ sampleRate: TARGET_RATE });
      if (micContext.state === 'suspended') {
        await micContext.resume();
      }
      await ensurePlaybackContext();

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: TARGET_RATE,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      setStatus('Connecting…');
      await connectWebSocket();

      const nativeRate = micContext.sampleRate;
      source = micContext.createMediaStreamSource(mediaStream);
      processor = micContext.createScriptProcessor(PROCESSOR_SIZE, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!running || !speechReady || !ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        const rms = computeRms(input);
        const atTarget = resampleStateful(input, nativeRate, TARGET_RATE);
        pendingSamples = concatFloat32(pendingSamples, atTarget);
        if (agentAudible()) {
          flushMicChunks();
          return;
        }
        updateMicStatus(rms);
        flushPendingSamples();
      };

      muteGain = micContext.createGain();
      muteGain.gain.value = 0;
      source.connect(processor);
      processor.connect(muteGain);
      muteGain.connect(micContext.destination);
    }

    function stop(options = {}) {
      const preserveStatus = options.preserveStatus === true;
      running = false;
      speechReady = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setTtsControlsDisabled(false);
      pendingSamples = new Float32Array(0);
      resamplePhase = 0;

      cancelEchoTail();
      handleBargeIn();
      clearLiveCaption();

      userSpeaking = false;
      if (processor) { processor.disconnect(); processor.onaudioprocess = null; processor = null; }
      if (muteGain) { muteGain.disconnect(); muteGain = null; }
      if (source) { source.disconnect(); source = null; }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (micContext) {
        micContext.close();
        micContext = null;
      }
      if (playbackContext) {
        playbackContext.close();
        playbackContext = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }

      if (!preserveStatus) {
        setStatus('Disconnected');
      }
    }

    startBtn.addEventListener('click', () => {
      start().catch(err => {
        if (!startupFailed) {
          showError(err.message || String(err));
        }
        stop({ preserveStatus: startupFailed });
      });
    });
    stopBtn.addEventListener('click', stop);

    logoutBtn.addEventListener('click', async () => {
      stop();
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (err) {
        console.error(err);
      }
      window.location.href = '/login';
    });
  </script>
</body>
</html>
